services:
    mongo:
        image: mongo:7
        restart: unless-stopped
        ports:
            - '127.0.0.1:27017:27017'
        command: ['mongod', '--replSet', 'rs0', '--bind_ip', '0.0.0.0']
        volumes:
            - mongo_data:/data/db
        # Bounded container logs: without this the Docker json-file driver
        # grows without limit, which matters on hosts with small disks.
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        healthcheck:
            test:
                [
                    'CMD',
                    'mongosh',
                    '--quiet',
                    '--eval',
                    "db.adminCommand('ping')",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    mongo_data:
