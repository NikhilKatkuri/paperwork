services:
    redis:
        image: redis:8-alpine
        restart: unless-stopped
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5
    mongo:
        image: mongo:7
        restart: unless-stopped
        ports:
            - '127.0.0.1:27017:27017'
        command: ['mongod', '--replSet', 'rs0', '--bind_ip', '0.0.0.0']
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test:
                [
                    'CMD',
                    'mongosh',
                    '--quiet',
                    '--eval',
                    "db.adminCommand('ping')",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    redis_data:
    mongo_data:
