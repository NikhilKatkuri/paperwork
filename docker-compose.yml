services:
    mongo:
        image: mongo:7
        restart: unless-stopped
        ports:
            - '127.0.0.1:27017:27017'
        command: ['mongod', '--replSet', 'rs0', '--bind_ip', '0.0.0.0']
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test:
                [
                    'CMD',
                    'mongosh',
                    '--quiet',
                    '--eval',
                    "db.adminCommand('ping')",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    mongo_data:
